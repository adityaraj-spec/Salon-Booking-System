# ─── SalonNow Distributed Architecture — Local Test Stack ────────────────────
#
# Purpose: Simulate the full distributed production topology locally.
#          Run 2 API instances + 2 worker instances + Redis cluster seed + MongoDB RS.
#
# Usage:
#   docker-compose -f docker-compose.distributed.yml up --build --scale api=2 --scale worker=2
#
# Invariant Verification:
#   - I1 (Horizontal API): 2 API replicas behind NGINX
#   - I2 (Booking Correctness): Both replicas use shared Redis locks
#   - I5 (Socket.io): Redis Adapter broadcasts across both replicas
#   - I6 (Workers): 2 worker replicas share queues via BullMQ
#   - I7 (Cache): Pub/Sub invalidation propagates to both API replicas
#   - I8 (DB Pools): Each node limited to 15 connections (30 total)

version: "3.9"

services:
  # ─── Redis (Standalone for local dev, replace with cluster in staging) ───────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB (Replica set required for transactions) ─────────────────────────
  mongo:
    image: mongo:7.0
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── MongoDB Replica Set Initializer (one-time setup) ─────────────────────
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'
    restart: on-failure

  # ─── NGINX Load Balancer ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.distributed.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ─── API Server (stateless — scale with: --scale api=N) ───────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - NODE_ENV=development
      - PROCESS_TYPE=api
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_MODE=standalone
      - MONGO_MAX_POOL_SIZE=15
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - CORS_ORIGIN=http://localhost:80,http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    # No fixed port mapping — NGINX handles load balancing

  # ─── Background Workers (scale with: --scale worker=N) ────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - NODE_ENV=development
      - PROCESS_TYPE=worker
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_MODE=standalone
      - MONGO_MAX_POOL_SIZE=10
      # Only first worker replica runs the ChangeStream watcher
      - ENABLE_HOLD_WATCHER=true
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:

# ─── NGINX Load Balancer for SalonNow Distributed Stack ─────────────────────
#
# Handles:
#   - HTTP/REST API traffic (Round-Robin load balancing)
#   - WebSocket upgrades for Socket.io (sticky session via ip_hash for WS handshake)
#   - Connection draining headers
#   - Proxy buffering disabled for SSE/streaming

upstream salonnow_api {
    # ip_hash ensures WebSocket connections go to the same backend for initial handshake.
    # After Redis Adapter is active, subsequent socket.io events are cross-server anyway.
    ip_hash;
    server api:8000 max_fails=3 fail_timeout=30s;
    # Docker Compose --scale api=N adds more servers dynamically
    # In Kubernetes: use a Headless Service + NGINX Ingress instead
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ─── Health check endpoints (bypass rate limiting) ──────────────────────
    location /health/ {
        proxy_pass http://salonnow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Socket.io WebSocket upgrade ────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://salonnow_api;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for WebSocket connections (30 min)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # Disable buffering for real-time events
        proxy_buffering off;
    }

    # ─── REST API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://salonnow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Retry on upstream failures (GET requests only — POST/PATCH are not retried)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ─── Default ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://salonnow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

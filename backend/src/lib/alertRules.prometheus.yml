groups:
  - name: salonnow_slo_alerts
    rules:
      - alert: HighErrorRateBurnRate
        expr: (sum(rate(http_requests_total{statusCode=~"5.."}[1h])) / sum(rate(http_requests_total[1h]))) > 0.002
        for: 5m
        labels:
          severity: critical
          slo: availability
        annotations:
          summary: "API 5xx error rate consuming error budget rapidly"
          description: "5xx error rate over 1h is {{ $value | humanizePercentage }}, exceeding 2% burn rate limit."

      - alert: SlowAPILatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "p99 API latency exceeds 500ms threshold"
          description: "99th percentile HTTP latency is {{ $value }}s over last 5 minutes."

      - alert: OutboxBacklogHigh
        expr: outbox_queue_backlog > 1000
        for: 10m
        labels:
          severity: warning
          component: outbox_worker
        annotations:
          summary: "Outbox pending backlog high (> 1000 events)"
          description: "Outbox queue backlog has {{ $value }} pending events for > 10 minutes."

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
          component: razorpay_integration
        annotations:
          summary: "Razorpay Circuit Breaker is OPEN"
          description: "Payment integration circuit breaker opened due to upstream Razorpay failures."

apiVersion: apps/v1
kind: Deployment
metadata:
  name: salonnow-api
  namespace: production
  labels:
    app.kubernetes.io/name: salonnow-api
    app.kubernetes.io/part-of: salonnow-platform
    app.kubernetes.io/component: backend-api
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: salonnow-api
  template:
    metadata:
      labels:
        app: salonnow-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["salonnow-api"]
                topologyKey: "topology.kubernetes.io/zone"
      containers:
        - name: api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/salonnow-api:v6.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: salonnow-secrets
            - configMapRef:
                name: salonnow-config

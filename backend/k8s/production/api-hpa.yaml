apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salonnow-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salonnow-api
  minReplicas: 10
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: External
      external:
        metric:
          name: prometheus_http_requests_per_second
        target:
          type: Value
          averageValue: "500"
